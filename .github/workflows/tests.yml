name: Todo-app Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run end-to-end tests
        run: |
          npm start > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/health; then
              echo
              npm run test:e2e
              exit $?
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server.log
              echo "The app server exited before becoming ready."
              exit 1
            fi

            sleep 1
          done

          cat server.log
          echo "The app server did not become ready within 30 seconds."
          exit 1
